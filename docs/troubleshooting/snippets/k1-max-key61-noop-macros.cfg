# Append to the printer's gcode_macro.cfg (Moonraker config root) while the
# printer is idle, then FIRMWARE_RESTART. Copy by hand. Nothing in this
# repository, and no CI job, uploads this file to a printer.
#
# Lab K1 Max (K1Max-Printy-Baby, 10.0.0.210): both sections were absent from
# live gcode_macro.cfg on 2026-10-28. A 2026-07-05 note recorded them as
# added; they were lost later or never stuck. Do not append a second copy
# if the sections are already defined (Klipper rejects duplicate sections).
#
# Procedure: docs/troubleshooting/printer-unknown-error-key61.md

# --- silence stray "Unknown command" (key61) popups (no CFS, single extruder) ---
[gcode_macro T0]
description: No-op tool select (single-extruder K1 Max)
gcode:
    # intentionally empty

[gcode_macro BOX_ENABLE_CFS_PRINT]
description: No-op CFS enable (no Creality Filament System installed)
gcode:
    # intentionally empty
